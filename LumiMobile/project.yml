name: LumiMobile
options:
  bundleIdPrefix: com.lumi
  deploymentTarget:
    iOS: "17.0"
packages:
  LumiMobileKit:
    path: LumiMobileKit
targets:
  LumiMobile:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LumiMobileKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumi
        NSCameraUsageDescription: Eşleştirme QR kodunu okumak için kamera gerekir.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.lumi.LumiMobile.pair
            CFBundleURLSchemes: [lumi-remote]
