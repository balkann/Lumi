name: LumiMobile
options:
  bundleIdPrefix: com.lumi
  deploymentTarget:
    iOS: "17.0"
packages:
  LumiMobileKit:
    path: LumiMobileKit
schemes:
  LumiMobile:
    build:
      targets:
        LumiMobile: all
        LumiMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumiMobileUITests
      environmentVariables:
        PAIRING_STRING: $(PAIRING_STRING)

targets:
  LumiMobile:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LumiMobileKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lumi
        NSCameraUsageDescription: Eşleştirme QR kodunu okumak için kamera gerekir.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.lumi.LumiMobile.pair
            CFBundleURLSchemes: [lumi-remote]
  LumiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LumiMobile
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
